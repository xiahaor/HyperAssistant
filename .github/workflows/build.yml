name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write      # 打 tag 时要创建 Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 SDK 组件（compileSdk 37 / build-tools 35.0.0）
        run: |
          sdkmanager --install "platform-tools" "platforms;android-37" "build-tools;35.0.0" || \
          sdkmanager --install "platform-tools" "platforms;android-37" "build-tools;35.0.0" --channel=0

      - name: 构建（release）
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      # 没有密钥 ⇒ 产出 app-release-unsigned.apk（这是**预期行为**，见 README「构建」）
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: HyperAssistant-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: HyperAssistant-apk
          path: apk

      - name: 创建 Release 并附上 APK
        uses: softprops/action-gh-release@v2
        with:
          files: apk/*.apk
          generate_release_notes: true
          body: |
            > ⚠️ 本 Release 里的 APK 由 CI 构建，**未签名**（仓库不含任何私钥）。
            > 安装前请自行签名，例如：
            > ```bash
            > apksigner sign --ks your.jks --out signed.apk app-release-unsigned.apk
            > ```
            > 也可以直接用 MT 管理器 / 各类"APK 签名"工具签。
            >
            > 装机三步见 README（**第 2 步"把 APK 放到 /data/adb"别省**，否则 system_server 会在开机早期读不到模块）。
