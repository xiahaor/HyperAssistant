name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write      # 打 tag 时要创建 Release

jobs:
  build:
    runs-on: ubuntu-latest
    # 签名密钥（可选）：在仓库 Settings → Secrets and variables → Actions 里配这 4 个，
    # CI 就会产出【已签名、可直接安装】的 APK；不配则退回 app-release-unsigned.apk。
    #   KEYSTORE_B64        keystore 文件的 base64（单行）
    #   KEYSTORE_PASSWORD   keystore 口令
    #   KEY_ALIAS           key 别名
    #   KEY_PASSWORD        key 口令（与 keystore 口令相同可留空）
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ⚠ 不再用 android-actions/setup-android：本仓库曾在该步失败（2026-11-15 run 43621901400，
      #   第 4 步 failure ⇒ 后面全部 skipped）。ubuntu-latest 运行器**已预装** Android SDK，
      #   官方 runner-images 文档写明：ANDROID_HOME=/usr/local/lib/android/sdk，
      #   预装 build-tools 34/35/36/37，预装平台含 android-37.0 / 37.1 / 37.2（**没有** android-37）。
      - name: 显示预装 SDK 状态（诊断）
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK"
          echo "--- platforms:"; ls "$SDK/platforms" 2>/dev/null || true
          echo "--- build-tools:"; ls "$SDK/build-tools" 2>/dev/null || true

      # compileSdk 37：平台包名在新 SDK 里是 android-37.0/37.1/37.2，逐个尝试（失败不阻断）。
      # build-tools 必须 ≥ 36.0.0：AGP 9.4.1 会忽略 35.0.0（本机实测该 WARNING）。
      - name: 补齐 SDK 组件（build-tools 36.0.0 + API 37 平台）
        run: |
          set -u
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SM" ] || SM="$(command -v sdkmanager || true)"
          echo "sdkmanager=${SM:-<未找到>}  SDK=$SDK"
          if [ -n "${SM:-}" ] && [ -x "$SM" ]; then
            yes | "$SM" --licenses >/dev/null 2>&1 || true
            for p in "platform-tools" "build-tools;36.0.0" "platforms;android-37" \
                     "platforms;android-37.0" "platforms;android-37.1"; do
              echo "--- install $p"
              "$SM" --install "$p" || echo "    (跳过：$p 不可用/已装)"
            done
          fi
          echo "=== 最终 platforms ==="; ls "$SDK/platforms" 2>/dev/null || true
          echo "=== 最终 build-tools ==="; ls "$SDK/build-tools" 2>/dev/null || true

      # AGP 找的是 platforms/android-37；若只有 android-37.N（新命名）就补一个指向它的软链。
      - name: 兼容平台目录名（android-37 → 实际 android-37.N）
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ ! -d "$SDK/platforms/android-37" ]; then
            for cand in "$SDK"/platforms/android-37.*; do
              [ -d "$cand" ] || continue
              case "$cand" in *beta*) continue ;; esac
              echo "→ 软链 $(basename "$cand") => android-37"
              ln -s "$cand" "$SDK/platforms/android-37" || true
              break
            done
          fi
          ls -d "$SDK"/platforms/android-37* 2>/dev/null || true

      # secrets 不能直接用在 if 里 ⇒ 提升到 job env（见上）后用 env 判断。
      - name: 解码签名密钥（仅在配置了 secret 时）
        if: ${{ env.KEYSTORE_B64 != '' }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "HA_KEYSTORE=$RUNNER_TEMP/release.jks"
            echo "HA_KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD}"
            echo "HA_KEY_ALIAS=${KEY_ALIAS}"
            echo "HA_KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          } >> "$GITHUB_ENV"
          echo "✔ 已注入签名配置 ⇒ 本次产出已签名 APK"

      - name: 构建（release）
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: HyperAssistant-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: HyperAssistant-apk
          path: apk

      # 用 tag 名命名，并把"是否已签名"如实写进 Release 说明（不写死）。
      - name: 整理文件名 + 生成说明
        run: |
          set -euo pipefail
          APK="$(ls apk/*.apk | head -1)"
          OUT="apk/HyperAssistant-${GITHUB_REF_NAME}.apk"
          mv "$APK" "$OUT"
          echo "ASSET=$OUT" >> "$GITHUB_ENV"
          if echo "$OUT" | grep -qi unsigned; then
            {
              echo '> ⚠️ 本 APK 由 CI 构建，但仓库**未配置签名密钥** ⇒ **未签名**，安装前需自行签名。'
              echo '>'
              echo '> ```bash'
              echo '> apksigner sign --ks your.jks --out signed.apk <本文件>'
              echo '> ```'
              echo '> 也可用 MT 管理器等工具签名。'
            } > body.md
          else
            {
              echo '> ✅ 本 APK 由 CI 自动构建并**已签名**，可直接安装。'
            } > body.md
          fi
          {
            echo ''
            echo '### 装机'
            echo '1. 安装 APK'
            echo '2. 在 LSPosed 里启用本模块，勾选 4 个作用域（`system` / `com.miui.personalassistant` / `com.miui.home` / `com.android.systemui`）'
            echo '3. 重启手机'
            echo ''
            echo '详见 README；重装后若模块失效，先检查 LSPosed 里该模块的 `apk_path` 是否指向当前安装路径。'
          } >> body.md

      - name: 创建 Release 并附上 APK
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
          body_path: body.md
          generate_release_notes: true
